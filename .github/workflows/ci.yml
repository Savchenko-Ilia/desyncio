# CI runs on pull requests (and manually) only. There is deliberately no `push`
# trigger: the owner wants to save Actions minutes, and every change reaches a
# branch through a PR anyway. Mirrors the commands in scripts/gate.env.
name: CI

on:
  # No branch filter: PRs into any branch (feature -> integration, integration -> main).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -q

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src
